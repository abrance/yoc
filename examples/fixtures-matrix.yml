name: Fixture Matrix

on:
  pull_request:
  push:
    branches: [main]

jobs:
  go-hello:
    uses: owner/yoc/.github/workflows/go-ci.yml@v1
    with:
      working-directory: fixtures/go-hello
      go-version-file: fixtures/go-hello/go.mod
      cache-dependency-path: fixtures/go-hello/go.mod

  rust-hello:
    uses: owner/yoc/.github/workflows/rust-ci.yml@v1
    with:
      working-directory: fixtures/rust-hello

  react-hello:
    uses: owner/yoc/.github/workflows/react-ci.yml@v1
    with:
      working-directory: fixtures/react-hello
      cache: false
      install-command: npm install
      lint-command: ""
      test-command: ""

  vue-hello:
    uses: owner/yoc/.github/workflows/vue-ci.yml@v1
    with:
      working-directory: fixtures/vue-hello
      cache: false
      install-command: npm install
      lint-command: ""
      test-command: ""
