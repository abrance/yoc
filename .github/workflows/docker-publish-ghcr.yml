name: Docker Publish GHCR

on:
  workflow_call:
    inputs:
      context:
        description: Docker build context path.
        required: false
        type: string
        default: .
      file:
        description: Dockerfile path.
        required: false
        type: string
        default: ./Dockerfile
      image-name:
        description: Image name without registry, usually owner/repository or owner/repository/name.
        required: true
        type: string
      platforms:
        description: Comma-separated target platforms.
        required: false
        type: string
        default: linux/amd64
      tags:
        description: Newline-separated docker/metadata-action tag rules.
        required: false
        type: string
        default: |
          type=ref,event=branch
          type=ref,event=tag
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix={{branch}}-
      labels:
        description: Newline-separated docker/metadata-action labels.
        required: false
        type: string
        default: ""
    secrets:
      github-token:
        description: Token used to publish to GHCR. Pass secrets.GITHUB_TOKEN unless using a PAT.
        required: true
    outputs:
      digest:
        description: Published image digest.
        value: ${{ jobs.docker-publish.outputs.digest }}
      metadata-tags:
        description: Tags generated by docker/metadata-action.
        value: ${{ jobs.docker-publish.outputs.metadata-tags }}

permissions:
  contents: read
  packages: write

jobs:
  docker-publish:
    name: Docker Publish GHCR
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      metadata-tags: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.github-token }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ inputs.image-name }}
          tags: ${{ inputs.tags }}
          labels: ${{ inputs.labels }}

      - name: Build and publish Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          push: true
          platforms: ${{ inputs.platforms }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
