name: Docker Build

on:
  workflow_call:
    inputs:
      context:
        description: Docker build context path.
        required: false
        type: string
        default: .
      file:
        description: Dockerfile path.
        required: false
        type: string
        default: ./Dockerfile
      build-args:
        description: Newline-separated non-secret Docker build arguments.
        required: false
        type: string
        default: ""
      target:
        description: Optional Dockerfile build stage target.
        required: false
        type: string
        default: ""
      image-name:
        description: Image name used for local metadata tags.
        required: true
        type: string
      platforms:
        description: Comma-separated target platforms.
        required: false
        type: string
        default: linux/amd64
      push:
        description: Whether to push the image. Keep false for pull request validation.
        required: false
        type: boolean
        default: false
      tags:
        description: Newline-separated docker/metadata-action tag rules.
        required: false
        type: string
        default: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
      labels:
        description: Newline-separated docker/metadata-action labels.
        required: false
        type: string
        default: ""
    outputs:
      digest:
        description: Image digest from docker/build-push-action.
        value: ${{ jobs.docker-build.outputs.digest }}
      metadata-tags:
        description: Tags generated by docker/metadata-action.
        value: ${{ jobs.docker-build.outputs.metadata-tags }}

permissions:
  contents: read

jobs:
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      metadata-tags: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.image-name }}
          tags: ${{ inputs.tags }}
          labels: ${{ inputs.labels }}

      - name: Build Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          push: ${{ inputs.push }}
          platforms: ${{ inputs.platforms }}
          build-args: ${{ inputs.build-args }}
          target: ${{ inputs.target }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
