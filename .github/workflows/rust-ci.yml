name: Rust CI

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory containing the Rust project.
        required: false
        type: string
        default: .
      rust-toolchain:
        description: Rust toolchain channel or version to install.
        required: false
        type: string
        default: stable
      components:
        description: Comma-separated Rust components to install.
        required: false
        type: string
        default: rustfmt,clippy
      run-fmt:
        description: Run cargo fmt check.
        required: false
        type: boolean
        default: true
      run-clippy:
        description: Run cargo clippy with warnings denied.
        required: false
        type: boolean
        default: true
      run-tests:
        description: Run cargo test.
        required: false
        type: boolean
        default: true
      run-build:
        description: Run cargo build.
        required: false
        type: boolean
        default: true
      cache-key-prefix:
        description: Prefix for cache keys, useful when one repository has multiple Rust projects.
        required: false
        type: string
        default: rust

permissions:
  contents: read

jobs:
  rust-ci:
    name: Rust CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ inputs.rust-toolchain }}
          components: ${{ inputs.components }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-${{ inputs.cache-key-prefix }}-registry-${{ hashFiles(format('{0}/Cargo.lock', inputs.working-directory)) }}
          restore-keys: |
            ${{ runner.os }}-${{ inputs.cache-key-prefix }}-registry-

      - name: Cache cargo git index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-${{ inputs.cache-key-prefix }}-git-${{ hashFiles(format('{0}/Cargo.lock', inputs.working-directory)) }}
          restore-keys: |
            ${{ runner.os }}-${{ inputs.cache-key-prefix }}-git-

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: ${{ inputs.working-directory }}/target
          key: ${{ runner.os }}-${{ inputs.cache-key-prefix }}-target-${{ hashFiles(format('{0}/Cargo.lock', inputs.working-directory)) }}
          restore-keys: |
            ${{ runner.os }}-${{ inputs.cache-key-prefix }}-target-

      - name: Check formatting
        if: inputs.run-fmt
        working-directory: ${{ inputs.working-directory }}
        run: cargo fmt --all -- --check

      - name: Run clippy
        if: inputs.run-clippy
        working-directory: ${{ inputs.working-directory }}
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        if: inputs.run-tests
        working-directory: ${{ inputs.working-directory }}
        run: cargo test --all-features

      - name: Build
        if: inputs.run-build
        working-directory: ${{ inputs.working-directory }}
        run: cargo build --all-features
